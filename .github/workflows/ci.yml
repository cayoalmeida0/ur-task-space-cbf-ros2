name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy osqp==1.1.3 pytest

      - name: Validate shell and Python syntax
        run: |
          bash -n docker/entrypoint.sh scripts/*.sh
          python -m compileall -q \
            ur_cbf_ws/src/ur_cbf_bringup \
            ur_cbf_ws/src/ur_cbf_control

      - name: Validate XML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [
              *Path("ur_cbf_ws/src").glob("*/package.xml"),
              *Path("ur_cbf_ws/src").glob("*/urdf/*.xacro"),
          ]
          for path in files:
              ET.parse(path)
          print(f"Validated {len(files)} XML/Xacro files")
          PY

      - name: Run ROS-independent unit tests
        env:
          PYTHONPATH: ur_cbf_ws/src/ur_cbf_bringup:ur_cbf_ws/src/ur_cbf_control
        run: |
          pytest -q \
            ur_cbf_ws/src/ur_cbf_bringup/test \
            ur_cbf_ws/src/ur_cbf_control/test
