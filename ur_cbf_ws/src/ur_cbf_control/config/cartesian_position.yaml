cartesian_position_test:
  ros__parameters:
    use_sim_time: true
    execute_test: false
    controller_node: /forward_velocity_controller
    command_topic: /forward_velocity_controller/commands
    joint_states_topic: /joint_states
    required_simulation_node: /gz_ros_control
    ur_type: ur3e
    model_joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    uaibot_mode: auto
    onrobot_type: rg2
    task_type: cartesian
    trajectory_profile: simple
    target_offset: [0.0, 0.0, 0.01]
    position_gains: [1.0, 1.0, 1.0]
    # pose usa o Jacobiano geometrico completo [v; omega] e mantem a
    # orientacao inicial durante a trajetoria.
    task_control_mode: pose
    orientation_gains: [0.5, 0.5, 0.5]
    orientation_target_mode: initial
    target_orientation_rpy: [0.0, 0.0, 0.0]
    cube_position: [0.0, 0.0, 0.32]
    drop_position: [0.20, 0.0]
    manipulation_approach_height: 0.10
    manipulation_lift_height: 0.12
    manipulation_drop_approach_height: 0.14
    manipulation_release_height: 0.08
    manipulation_retract_height: 0.16
    gripper_open_width: 0.08
    gripper_grasp_width: 0.035
    gripper_width_topic: /finger_width_controller/commands
    damping: 0.05
    controller_mode: qp
    qp_absolute_tolerance: 1.0e-6
    qp_relative_tolerance: 1.0e-6
    qp_max_iterations: 4000
    qp_time_limit: 0.01
    qp_polishing: false
    # off: nao calcula; monitor: registra; enforce: adiciona ao QP.
    self_collision_cbf_mode: off
    self_collision_safe_distance: 0.03
    self_collision_cbf_gain: 5.0
    self_collision_distance_tolerance: 5.0e-4
    self_collision_distance_max_iterations: 20
    # Matriz de colisoes permitidas: C32 x C51 e um par estrutural do punho.
    self_collision_excluded_pairs:
      - link_3_obj_1__link_5_obj_0
      - link_2_obj_2__link_4_obj_1
      - link_3_obj_0__link_5_obj_0
      - link_2_obj_2__link_4_obj_0
    # off: oculta; closest: menor distancia; all: todos os pares avaliados.
    self_collision_witness_mode: closest
    self_collision_witness_topic: /self_collision/witness_markers
    self_collision_witness_frame: base
    # Envelope axis-aligned no frame base: xmin, xmax, ymin, ymax, zmin, zmax.
    workspace_cbf_mode: monitor
    workspace_bounds: [-0.45, 0.45, -0.55, 0.55, 0.05, 0.90]
    workspace_safe_margin: 0.05
    workspace_cbf_gain: 7.0
    workspace_boundary_topic: /workspace/boundary_markers
    workspace_boundary_frame: base
    workspace_boundary_line_width: 0.005
    max_cartesian_speed: 0.01
    max_abs_joint_velocity: 0.10
    # Limites efetivos usados pelos perfis complex e challenging.
    complex_max_cartesian_speed: 0.04
    complex_max_abs_joint_velocity: 0.30
    complex_max_control_duration: 120.0
    complex_max_wall_control_duration: 600.0
    position_tolerance: 0.001
    settle_duration: 0.5
    success_hold_duration: 0.5
    zero_hold_duration: 0.5
    max_control_duration: 30.0
    max_wall_control_duration: 180.0
    state_timeout: 0.25
    startup_timeout: 15.0
    command_rate: 50.0
    experiment_id: cartesian_position_ur3e_001
    random_seed: 0
    result_directory: /workspace/results
    require_result_record: true
